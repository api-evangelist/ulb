reviews:
  - date: '2026-06-03'
    rating: 2
    summary: >-
      ULB's only publicly documented API surface is DI-fusion, the institutional
      research repository. The "DI-fusion Download & API" technical document
      (PDF, hosted on bib.ulb.be) describes a Scholar export API and a Group
      export API at difusion-svc.ulb.ac.be, plus a search API, RSS feeds, a
      sitemap, and an OAI-PMH harvesting service. The Scholar export endpoint
      was verified live, returning a valid XML publication list (HTTP 200). The
      VuFind OAI endpoint paths probed returned HTTP 500, so the OAI service is
      cataloged from documentation rather than a verified live response. An
      official GitHub organization (github.com/ulb) exists with ~13 mostly
      departmental repos. No public student/SIS, timetable, library discovery,
      or SSO API documentation was found. No fabricated endpoints are included.
