    description: >-
      ULB's institutional SAML 2.0 identity provider publishes complete, unauthenticated metadata
      at https://auth.ulb.be/idp/metadata — IDPSSODescriptor and AttributeAuthorityDescriptor
      roles, SingleSignOnService, SingleLogoutService and AttributeService endpoints over
      HTTP-Redirect, HTTP-POST, HTTP-POST-SimpleSign and SOAP bindings, shibmd:Scope ulb.be, the
      REFEDS Research and Scholarship entity category and the REFEDS SIRTFI assurance
      certification. It is the machine-readable front door to every gated ULB system and the most
