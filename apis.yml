apis:
  - aid: ulb:difusion-scholar
    name: DI-fusion Scholar Export API
    description: >-
      Documented HTTP GET API that exports the publication list for a given
      ULB scholar (identified by matricule or DAI). Supports output formats
      including APA, BibTeX, RIS, CSV, xml-brief, xml-brief-ext and xml-full,
      with grouping, role filtering, markup and language options. Returns live
      XML/text bibliographic data.
    humanURL: https://bib.ulb.be/en/find-documents/di-fusion
    baseURL: https://difusion-svc.ulb.ac.be/scholar
    tags: [ Research, Open Access, Institutional Repository, Bibliography ]
    properties:
      - type: Documentation
        url: https://bib.ulb.be/medias/fichier/difusion-download-and-api_1678451163130-pdf?ID_FICHE=10054&INLINE=FALSE
  - aid: ulb:difusion-group
    name: DI-fusion Group Export API
    description: >-
      Documented HTTP GET API that exports the publication list for a group of
      ULB scholars, defined either by a valid group ID or a list of scholar
      IDs. Shares output formats and options with the Scholar export API.
    humanURL: https://bib.ulb.be/en/find-documents/di-fusion
    baseURL: https://difusion-svc.ulb.ac.be/group
    tags: [ Research, Open Access, Institutional Repository, Bibliography ]
    properties:
      - type: Documentation
        url: https://bib.ulb.be/medias/fichier/difusion-download-and-api_1678451163130-pdf?ID_FICHE=10054&INLINE=FALSE
  - aid: ulb:difusion-oai
    name: DI-fusion OAI-PMH Harvesting Service
    description: >-
      ULB's DI-fusion institutional repository documents an OAI-PMH harvesting
      service allowing third parties to harvest metadata for non-profit
      purposes (provided the OAI identifier or source link is indicated).
      DI-fusion is registered in OpenDOAR, ROAR and Sherpa as an OAI-PMH
      compliant repository. The repository runs on VuFind; specific OAI base
      URLs were not returning a stable public response at review time.
    humanURL: https://bib.ulb.be/en/find-documents/di-fusion/terms-of-use
    tags: [ Research, Open Access, OAI-PMH, Metadata Harvesting ]
    properties:
      - type: Documentation
        url: https://bib.ulb.be/medias/fichier/difusion-download-and-api_1678451163130-pdf?ID_FICHE=10054&INLINE=FALSE
