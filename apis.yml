      di-fusion@ulb.be. The repository software is VuFind, which is open source and self-hosted by
      ULB, not a vendor SaaS — the deployment, the host and the metadata are ULB's. Verified live
      2026-08-30.
    description: >-
      OAI-PMH 2.0 endpoint for the DI-fusion repository. Answers verb=Identify and
      verb=ListMetadataFormats with valid protocol documents (advertising oai_dc only), but under
      HTTP 500 and with an HTML page appended after the closing tag. Every record-bearing verb
      rejects the advertised metadataPrefix=oai_dc with badArgument "Missing Metadata Prefix", so
      no metadata can be harvested despite DI-fusion being registered as OAI-PMH compliant in
      OpenDOAR, ROAR and Sherpa. Recorded as measured, not as advertised.
