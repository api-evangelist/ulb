description: >-
  Université libre de Bruxelles (ULB) is a French-speaking research university in Brussels,
  Belgium, founded in 1834 and funded through the Fédération Wallonie-Bruxelles. Unusually for
  this cohort, ULB operates its research infrastructure itself rather than renting it: there is no
  Figshare, Elsevier Pure, Dataverse or Ex Libris Esploro tenant under ULB's name, and the one
  documented API it publishes is its own engineering. DI-fusion, the institutional repository run
  by the ULB Libraries, exposes a bespoke HTTP export service at difusion-svc.ulb.ac.be that
  renders a scholar's or a group's publication list in APA, BibTeX, RIS, CSV and three ULB XML
  formats, documented in a 15-page PDF the library publishes itself. ULB also runs a Shibboleth
  SAML 2.0 identity provider registered in the Belnet R&E Federation and visible in eduGAIN, an
  OAI-PMH endpoint and an OpenSearch description on its self-hosted VuFind discovery layer, and
  mints its own info:ulb-repo/semantics/ publication-type vocabulary. The footprint is small and
  visibly under-maintained: the richest documented export format returns 403, the format added by
  the most recent documentation revision returns 500, the OAI-PMH endpoint answers Identify but
  rejects the metadata prefix it advertises so nothing can actually be harvested, the advertised
  unAPI server does not answer, and the DSpace instance behind its full-text links is erroring.
  There is no developer portal, no changelog, no status page, no OpenAPI of ULB's own, and every
  other ULB system — timetable, registrar, library discovery, researcher CVs — is behind the
  central ULB login or unreachable from the public internet.
