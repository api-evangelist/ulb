  detail: >-
    ULB operates a real, documented, institution-engineered API and a complete SAML 2.0 identity
    provider, and both were exercised live on 2026-08-30. This is not a vendor contract wearing the
    university's name: no Figshare, Pure, Dataverse or Esploro tenant exists under ULB, and the
    DI-fusion export service, its OAI-PMH endpoint, its OpenSearch description and its
    info:ulb-repo/semantics/ vocabulary are all ULB's own. Coverage is nonetheless narrow and the
    surfaces are decaying — reftype=xml-full returns 403, reftype=xml-brief-ext returns 500, the
    OAI-PMH endpoint rejects the metadataPrefix it advertises so nothing is harvestable, the
    advertised unAPI server on port 8080 does not answer, and dipot.ulb.ac.be, the DSpace instance
    serving the full-text links, returns "DSpace at ULB: Internal system error". ULB publishes no
    developer portal, no OpenAPI, no changelog, no status page and no security.txt, and its
    timetable (gehol.ulb.be) and library discovery (cible.ulb.be) hosts resolve in DNS but time out
    from the public internet, so neither could be assessed. All four apis[] entries carry
    x-operator: institution; none is a tenant or a vendor surface.
