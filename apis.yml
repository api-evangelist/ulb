---
aid: ulb
name: Université libre de Bruxelles
description: >-
  Université libre de Bruxelles (ULB) is a major French-speaking research
  university in Brussels, Belgium, ranked #230 in the QS World University
  Rankings 2025. Its public, documented developer footprint is centered on
  DI-fusion, the university's institutional research repository, which exposes
  a documented HTTP export API for scholar and group publication lists, a
  search interface, RSS feeds, and an OAI-PMH harvesting service for metadata.
  ULB also maintains an official GitHub organization for departmental and
  research code. Beyond these, most ULB systems (student/SIS portals, library
  discovery, SSO) are gated and not publicly documented as APIs.
